name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rozpakuj ZIP
        run: |
          unzip -o "*.zip" || true
          ls -la
          if [ -d "AudioQuarry-NATIVE-KOTLIN" ]; then cp -r AudioQuarry-NATIVE-KOTLIN/* .; fi
          if [ -d "AudioQuarry-NATIVE-ANDROID" ]; then cp -r AudioQuarry-NATIVE-ANDROID/* .; fi
          ls -la
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
      - name: Buduj APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AudioQuarry-APK
          path: app/build/outputs/apk/debug/*.apk
